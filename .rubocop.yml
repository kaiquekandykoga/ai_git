AllCops:
  SuggestExtensions: false

Gemspec/RequiredRubyVersion:
  Enabled: false

Style/Documentation:
  Enabled: false

# AGENTS.md 3.3 puts the file header directly after the magic comment.
Layout/EmptyLineAfterMagicComment:
  Enabled: false

Style/StringLiterals:
    EnforcedStyle: double_quotes

Metrics/AbcSize:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

